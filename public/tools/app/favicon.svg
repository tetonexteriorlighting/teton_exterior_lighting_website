<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="7" fill="#090910"/>

  <!-- House body -->
  <rect x="8" y="17" width="16" height="11" rx="1" fill="#1e1e2e"/>

  <!-- Roof -->
  <polygon points="16,6 5,18 27,18" fill="#2a2a3e"/>

  <!-- Roof outline glow -->
  <polyline points="5,18 16,6 27,18" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linejoin="round" opacity="0.35"/>

  <!-- Glow halo at peak -->
  <circle cx="16" cy="6" r="5" fill="#fbbf24" opacity="0.18"/>
  <circle cx="16" cy="6" r="3" fill="#fbbf24" opacity="0.25"/>

  <!-- Light bulb at peak -->
  <circle cx="16" cy="6" r="2" fill="#fbbf24"/>
  <circle cx="16" cy="6" r="0.9" fill="#ffffff"/>

  <!-- A couple lights along the roofline -->
  <circle cx="10.5" cy="13" r="1.4" fill="#fbbf24" opacity="0.7"/>
  <circle cx="10.5" cy="13" r="0.6" fill="#ffffff" opacity="0.9"/>

  <circle cx="21.5" cy="13" r="1.4" fill="#fbbf24" opacity="0.7"/>
  <circle cx="21.5" cy="13" r="0.6" fill="#ffffff" opacity="0.9"/>

  <!-- Door -->
  <rect x="13" y="21" width="6" height="7" rx="1" fill="#0d0d1a"/>
</svg>
